version: '3.9'

services:

  # ─── Service Discovery ──────────────────────────────────────
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - histry-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  # ─── API Gateway ────────────────────────────────────────────
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - histry-net

  # ─── Auth Service ───────────────────────────────────────────
  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/auth_db
      SPRING_DATASOURCE_USERNAME: auth_user
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
    depends_on:
      postgres-auth:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - histry-net

  # ─── Content Service ────────────────────────────────────────
  content-service:
    build: ./content-service
    container_name: content-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-content:5432/content_db
      SPRING_DATASOURCE_USERNAME: content_user
      SPRING_DATASOURCE_PASSWORD: ${CONTENT_DB_PASSWORD}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      postgres-content:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - histry-net

  # ─── Game Service (STATELESS — no DB) ───────────────────────
  game-service:
    build: ./game-service
    container_name: game-service
    ports:
      - "8083:8083"
    environment:
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL}
      CONTENT_SERVICE_URL: ${CONTENT_SERVICE_URL}
    depends_on:
      eureka-server:
        condition: service_healthy
      content-service:
        condition: service_started
    networks:
      - histry-net

  # ─── Suggestion Service ─────────────────────────────────────
  suggestion-service:
    build: ./suggestion-service
    container_name: suggestion-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-suggest:5432/suggestion_db
      SPRING_DATASOURCE_USERNAME: suggest_user
      SPRING_DATASOURCE_PASSWORD: ${SUGGEST_DB_PASSWORD}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      postgres-suggest:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - histry-net

  # ─── Frontend ───────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - histry-net

  # ═══════════════════════════════════════════════════════════
  # DATABASES — Her servis kendi PostgreSQL instance'ı
  # ═══════════════════════════════════════════════════════════

  postgres-auth:
    image: postgres:16-alpine
    container_name: postgres-auth
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    volumes:
      - pgdata-auth:/var/lib/postgresql/data
    networks:
      - histry-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-content:
    image: postgres:16-alpine
    container_name: postgres-content
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: content_db
      POSTGRES_USER: content_user
      POSTGRES_PASSWORD: ${CONTENT_DB_PASSWORD}
    volumes:
      - pgdata-content:/var/lib/postgresql/data
    networks:
      - histry-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U content_user -d content_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-suggest:
    image: postgres:16-alpine
    container_name: postgres-suggest
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: suggestion_db
      POSTGRES_USER: suggest_user
      POSTGRES_PASSWORD: ${SUGGEST_DB_PASSWORD}
    volumes:
      - pgdata-suggest:/var/lib/postgresql/data
    networks:
      - histry-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suggest_user -d suggestion_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════════
  # KAFKA
  # ═══════════════════════════════════════════════════════════

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - histry-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      - zookeeper
    networks:
      - histry-net
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

# ═══════════════════════════════════════════════════════════════
# VOLUMES — Her servis için bağımsız persistent storage
# ═══════════════════════════════════════════════════════════════
volumes:
  pgdata-auth:
  pgdata-content:
  pgdata-suggest:

# ═══════════════════════════════════════════════════════════════
# NETWORK
# ═══════════════════════════════════════════════════════════════
networks:
  histry-net:
    driver: bridge
