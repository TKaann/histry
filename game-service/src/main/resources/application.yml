server:
  port: 8083

spring:
  application:
    name: game-service

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

content-service:
  url: ${CONTENT_SERVICE_URL:http://content-service:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
